name: Comprobar reglas de Firestore — Loja
on:
  pull_request:
    paths:
      - 'impulso/firestore-loja.rules'
      - 'impulso/tests/**'
      - '.github/workflows/pruebas-firestore-loja.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probar-firestore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Instalar dependencias de pruebas
        working-directory: impulso/tests
        run: npm install --no-audit --no-fund
      - name: Ejecutar 16 pruebas contra el emulador (proyecto demo)
        working-directory: impulso/tests
        run: |
          cp ../firestore-loja.rules firestore-loja.rules
          npx firebase-tools emulators:exec --project demo-loja-reglas --only firestore "npm test"
